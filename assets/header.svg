<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#05060a"/><stop offset="1" stop-color="#0b0d16"/></linearGradient>
<linearGradient id="gr" x1="0" x2="1"><stop offset="0" stop-color="#7c5cff"><animate attributeName="stop-color" values="#7c5cff;#22d3ee;#ff6b9a;#7c5cff" dur="8s" repeatCount="indefinite"/></stop><stop offset="1" stop-color="#22d3ee"><animate attributeName="stop-color" values="#22d3ee;#ff6b9a;#7c5cff;#22d3ee" dur="8s" repeatCount="indefinite"/></stop></linearGradient>
